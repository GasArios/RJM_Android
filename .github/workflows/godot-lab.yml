name: Godot Lab APK
on:
  push:
    branches: [godot-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Set up Godot and matching export template
        run: bash scripts/setup_godot_lab.sh
      - name: Import and test the playable scene
        run: |
          set -o pipefail
          timeout 90 "$RJM_GODOT" --headless --path godot-lab --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|^ERROR:' "$RUNNER_TEMP/import.log"
          timeout 75 "$RJM_GODOT" --headless --path godot-lab --script res://tests/behavior.gd 2>&1 | tee "$RUNNER_TEMP/test.log"
          grep -q 'PASS Godot aim pad' "$RUNNER_TEMP/test.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/test.log"
      - name: Restore fixed signing key
        id: signing
        env:
          RJM_ANDROID_KEYSTORE_BASE64: ${{ secrets.RJM_ANDROID_KEYSTORE_BASE64 }}
          RJM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RJM_ANDROID_KEYSTORE_PASSWORD }}
        run: python3 scripts/prepare_android_signing.py
      - name: Export and verify Android APKs
        env:
          RJM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RJM_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_READY: ${{ steps.signing.outputs.persistent_signing }}
        run: |
          test "$SIGNING_READY" = true
          bash scripts/export_godot_lab.sh
      - name: Remove key from build machine
        if: always()
        run: rm -f -- "$RUNNER_TEMP/rjm-private-signing/rjm-signing.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: Godot-Lab-Galaxy-APK
          path: lab-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: Godot-Lab-Emulator-APK
          path: lab-test/*.apk
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Godot-Lab-Emulator-APK
          path: lab-test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # ANGLE avoids the GLES translator's shader-link errors on the old
          # swiftshader_indirect backend, which can leave every frame blank.
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash tests/godot-android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Godot-Lab-Android-evidence
          path: lab-smoke/*
  release:
    # Require an explicit follow-up commit after reviewing rendered game captures.
    if: ${{ startsWith(github.event.head_commit.message, 'Publish reviewed') }}
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Godot-Lab-Galaxy-APK
          path: lab-dist
      - name: Publish the separate Godot test app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "godot-lab-${{ github.run_number }}" lab-dist/* \
            --target "${{ github.sha }}" --prerelease --latest=false \
            --title "RJM Godot Lab 0.1.1 (build ${{ github.run_number }})" \
            --notes-file godot-lab/RELEASE.md
