name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      persistent_signing: ${{ steps.signing.outputs.persistent_signing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Signing policy tests
        run: python3 tests/test_android_signing.py
      - name: Restore persistent signing identity
        id: signing
        env:
          RJM_ANDROID_KEYSTORE_BASE64: ${{ secrets.RJM_ANDROID_KEYSTORE_BASE64 }}
          RJM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RJM_ANDROID_KEYSTORE_PASSWORD }}
        run: python3 scripts/prepare_android_signing.py
      - name: Increasing APK version code
        run: echo "RJM_ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Core behavior tests
        run: |
          git clone https://github.com/raysan5/raylib.git build/raylib
          git -C build/raylib checkout c1ab645ca298a2801097931d1079b10ff7eb9df8
          bash tests/run-core-tests.sh build/raylib/src
      - name: Build native Android APK
        env:
          RJM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RJM_ANDROID_KEYSTORE_PASSWORD || 'rjm-ci-fixture-only' }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: APK validation
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RJM-Android-0.1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/RJM-Android-0.1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/RJM-Android-0.1.2.apk
          unzip -l dist/RJM-Android-0.1.2.apk | grep -E 'lib/(arm64-v8a|x86_64)/librjm.so'
          cd dist && sha256sum RJM-Android-0.1.2.apk > SHA256SUMS.txt
      - name: Build previous-version upgrade fixture
        env:
          RJM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RJM_ANDROID_KEYSTORE_PASSWORD || 'rjm-ci-fixture-only' }}
        run: |
          RJM_ANDROID_VERSION_CODE=$((RJM_ANDROID_VERSION_CODE - 1)) gradle --no-daemon :app:assembleDebug --stacktrace
          mkdir -p upgrade-dist
          cp app/build/outputs/apk/debug/app-debug.apk upgrade-dist/RJM-Android-Upgrade-Baseline.apk
          python3 scripts/verify_android_upgrade.py '${{ steps.signing.outputs.persistent_signing }}'
      - name: Delete temporary persistent key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/rjm-private-signing/rjm-signing.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: RJM-Android-Upgrade-Baseline
          path: upgrade-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: RJM-Android-APK
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: RJM-Android-Smoke-Test
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: RJM-Android-APK
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: RJM-Android-Smoke-Test
          path: test-dist
      - uses: actions/download-artifact@v4
        with:
          name: RJM-Android-Upgrade-Baseline
          path: upgrade-dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash tests/android-upgrade.sh
            bash tests/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-smoke-evidence
          path: smoke-output/*
  release:
    if: ${{ needs.build.outputs.persistent_signing == 'true' }}
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RJM-Android-APK
          path: dist
      - name: Publish installable prototype
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "android-prototype-${{ github.run_number }}" dist/* --target '${{ github.sha }}' --prerelease --title 'RJM Android 0.1.2 build ${{ github.run_number }}' --notes-file docs/release-persistent-signing.md
