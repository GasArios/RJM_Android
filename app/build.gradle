plugins { id 'com.android.application' }

android {
    namespace 'com.gasarios.rjm'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.gasarios.rjm'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    // Gradle creates a test signing key inside the temporary build environment.
    // Never commit or publish private signing keys.
    buildTypes { debug { debuggable true } }
    externalNativeBuild { cmake { path file('../CMakeLists.txt'); version '3.22.1' } }
    sourceSets { main { assets.srcDirs = ['../game/assets'] } }
}
